{% extends "layout.html" %}

{% block content %}
<div>
    <table class="table table-hover">
        <thead>
            <tr>
                <th scope="col">Room number</th>
                <th scope="col">Name</th>
                <th scope="col"></th>
            </tr>
        </thead>
        
        <tbody id="room_tbody">
        {% for data in roomData %}
        <tr>
            <td>{{ data.key.id }}</td>
            <td>{{ data.name }}</td>
            <td align="right">
                <div class="container-flex">
                    <a class="btn btn-dark" href="{{ url_for('newBooking', roomNumber=data.key.id) }}">Book now</a>
                    <form class="deleteRoom" action="{{ url_for('deleteRoom') }}" onclick="return confirmDelete(this);" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <input type="hidden" name="id" value="{{ data.key.id }}"/>
                        <input type="hidden" name="name" value="{{ data.name }}"/>
                        <a class="btn btn-danger">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                                <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                                <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                            </svg>
                            Delete room
                        </a>
                    </form>
                </div>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
